<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Đeo tai nghe để có trải nghiệm tốt nhất nha!">
    <link rel="shortcut icon" type="image/png" href="./images/blossom.png"/>
    <meta property="og:description" content="Ấn vào đây nè....">
    <meta property="og:image" content="./images/anhnen.jpg">
    <title>Khu Vườn Hoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Great+Vibes&family=Pacifico&family=Playball&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <audio id="bg-music" src="./Audio/eren.mp3" preload="auto"></audio>

    <audio id="bg-music-2" src="./Audio/windmoon.mp3" loop preload="auto"></audio>
    <div class="god-rays"></div>
    <div id="intro-screen" class="intro-container">
        <div class="intro-content">
            <h1 class="intro-title">Chào cậu!</h1>
            <p>Trước khi bắt đầu, hãy cho mình biết tên của cậu nhé:</p>
            <input type="text" id="username-input" placeholder="Nhập tên của bạn..." autocomplete="off">
            <button id="start-btn">Bắt đầu 🌸</button>
        </div>
    </div>

    <div id="main-scene" class="hidden-scene">
        <div id="sky-poem-container">
            <div id="sky-poem" data-text="Dẫu cõi nhân sinh lắm bẽ bàng,|Đường đời muôn nẻo những hoang mang.|Nụ cười phái đẹp dường phép lạ,|Sưởi ấm trần gian nét dịu dàng."></div>
            <div id="moon"></div>
        </div>
        <div class="ground" id="ground"></div>
    </div>

    <div id="wish-popup" class="hidden">
        <div class="wish-content">
            <span id="close-wish">&times;</span>
            <h3 id="wish-title">💌 Gửi tặng cậu</h3>
            <p id="wish-text"></p>
        </div>
    </div>

    <div id="flower-field-screen">
        <div id="heart-center-btn" class="hidden">
            <span>?</span>
        </div>
    </div>

    <div id="rose-screen" class="hidden">

        <div class="autumn-bg">
            <svg class="autumn-tree-svg" viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="foliage-dark" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#7a1c1c" />
                        <stop offset="100%" stop-color="#3d0a0a" />
                    </linearGradient>
                    <linearGradient id="foliage-red" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#d93829" />
                        <stop offset="100%" stop-color="#8a1812" />
                    </linearGradient>
                    <linearGradient id="foliage-orange" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#f27d24" />
                        <stop offset="100%" stop-color="#b83f0b" />
                    </linearGradient>
                    <linearGradient id="foliage-gold" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffdd55" />
                        <stop offset="100%" stop-color="#e67e22" />
                    </linearGradient>
                    <linearGradient id="trunk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#3a1e14" />
                        <stop offset="40%" stop-color="#24110b" />
                        <stop offset="100%" stop-color="#120805" />
                    </linearGradient>
                </defs>

                <path d="M 80,260 Q 50,240 60,210 Q 40,180 70,160 Q 65,120 100,115 Q 120,75 165,85 Q 200,50 245,75 Q 290,60 315,95 Q 360,105 355,150 Q 385,180 355,215 Q 365,250 325,265 Q 280,285 200,275 Q 120,285 80,260 Z" fill="url(#foliage-dark)" />

                <path d="M 224,285 C 255,265 290,255 330,245 C 300,245 275,250 255,260 C 270,240 285,225 295,210 C 278,225 260,242 245,265 C 235,272 228,278 223,275 Z" fill="url(#trunk-grad)" />

                <path d="M 50,225 Q 30,205 50,180 Q 45,150 80,145 Q 100,120 135,135 Q 170,125 180,155 Q 200,180 175,205 Q 150,235 110,225 Q 75,240 50,225 Z" fill="url(#foliage-gold)" />
                <path d="M 215,210 Q 195,185 220,160 Q 225,125 265,130 Q 300,110 330,140 Q 365,155 345,190 Q 360,220 325,230 Q 285,245 250,225 Q 230,230 215,210 Z" fill="url(#foliage-gold)" />

                <path d="M 60,195 Q 45,175 75,160 Q 105,140 135,160 Q 160,170 140,195 Q 115,210 90,200 Q 70,210 60,195 Z" fill="#ffee88" opacity="0.85" />
            </svg>

            <div class="falling-leaf"></div>
            <div class="falling-leaf"></div>
            <div class="falling-leaf"></div>
            <div class="falling-leaf"></div>
            <div class="falling-leaf"></div>
        </div>

        <div class="window-wood"></div>
        <div class="window-frame-inner"></div>

        <div class="rose-container">
            <div class="thorns">
                <div></div><div></div><div></div><div></div>
            </div>
            <div class="rose-leaves">
                <div></div> <div></div> <div></div>
            </div>
            <div class="rose-petals">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>

            <div class="pot">
                <div class="pot-shadow"></div>
                <div class="pot-body"></div>
                <div class="pot-top">
                    
                    <div class="soil"></div>
                </div>
            </div>

        </div>
        
    </div>

    <div class="copyright">
        @ ITMO <span id="author-name">Nguyên</span>
    </div>
    
    <script src="./script.js"></script>
</body>
</html>
